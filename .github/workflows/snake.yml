name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      # Amber palette to match the isometric calendar.
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffa53a&color_dots=#1c2129,#5a3410,#9a5a12,#d9831a,#ffb054
            dist/snake-light.svg?palette=github-light&color_snake=#c25e00&color_dots=#e6e9ed,#ffd8a8,#ffb366,#f08c00,#b35400

      # Orphan `output` branch so generated files never clutter main.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
