<svg xmlns="http://www.w3.org/2000/svg" width="420" height="190" viewBox="0 0 420 190" role="img" aria-label="LitWise AI"><title>LitWise AI</title><style>.t{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}.d{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#59636e}.m{font:600 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#c25e00}.g{font:11.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#1f2328}.s{font:11.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#59636e}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.f{animation:in .6s ease-out both}@keyframes edge{from{transform:scaleY(0)}to{transform:scaleY(1)}}.edge{transform-box:fill-box;transform-origin:top;animation:edge .8s cubic-bezier(.2,.8,.2,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="419" height="189" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect class="edge" x="0" y="18" width="3" height="40" rx="1.5" fill="#c25e00"/><g class="f"><text x="22" y="40" class="t">LitWise AI</text><text x="400" y="39" text-anchor="end" class="s">Python</text><text x="22" y="66" class="d">NLP system that ingests research papers, segments and</text><text x="22" y="85" class="d">scores them, then writes summaries and iterative peer</text><text x="22" y="104" class="d">reviews.</text><text x="22" y="131" class="m">▸ multi-doc ingest → summary → review</text></g><g class="f" style="animation-delay:.25s"><rect x="22" y="152" width="60" height="22" rx="11" fill="#eaeef2" stroke="#d0d7de"/><text x="52" y="167" text-anchor="middle" class="g">Python</text><rect x="89" y="152" width="53" height="22" rx="11" fill="#eaeef2" stroke="#d0d7de"/><text x="116" y="167" text-anchor="middle" class="g">Flask</text><rec