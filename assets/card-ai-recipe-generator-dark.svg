<svg xmlns="http://www.w3.org/2000/svg" width="420" height="190" viewBox="0 0 420 190" role="img" aria-label="AI Recipe Generator"><title>AI Recipe Generator</title><style>.t{font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}.d{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#8b949e}.m{font:600 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#ffa53a}.g{font:11.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#e6edf3}.s{font:11.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.f{animation:in .6s ease-out both}@keyframes edge{from{transform:scaleY(0)}to{transform:scaleY(1)}}.edge{transform-box:fill-box;transform-origin:top;animation:edge .8s cubic-bezier(.2,.8,.2,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="419" height="189" rx="12" fill="#161b22" stroke="#30363d"/><rect class="edge" x="0" y="18" width="3" height="40" rx="1.5" fill="#ffa53a"/><g class="f"><text x="22" y="40" class="t">AI Recipe Generator</text><text x="400" y="39" text-anchor="end" class="s">private build</text><text x="22" y="66" class="d">Serverless app on 7 AWS services with 5 independently</text><text x="22" y="85" class="d">deployed Lambdas, Cognito auth and Bedrock generation.</text><text x="22" y="112" class="m">▸ designed for 1M+ req / month</text></g><g class="f" style="animation-delay:.25s"><rect x="22" y="152" width="60" height="22" rx="11" fill="#21262d" stroke="#30363d"/><text x="52" y="167" text-anchor="middle" class="g">Lambda</text><rect x="89" y="152" width="95" height="22" rx="11" fill="#21262d" stroke="#30363d"/><text x="136" y="167" text-anchor="middle" class="g">API Gateway</text><rect x="191" y=