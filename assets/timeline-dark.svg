<svg xmlns="http://www.w3.org/2000/svg" width="860" height="366" viewBox="0 0 860 366" role="img" aria-label="Experience timeline"><title>Experience timeline</title><style>.r{font:600 15.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}.o{font:600 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#ffa53a}.w{font:12.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e}.p{font:13.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#8b949e}.b{fill:#79c0ff}@keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}.e{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}@keyframes ring{0%{r:6;opacity:.7}100%{r:17;opacity:0}}.ring{animation:ring 2s ease-out infinite}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.rail{transform-origin:top;transform-box:fill-box;animation:grow 1.4s ease-out both}@media (prefers-reduced-motion:reduce){.e{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="859" height="365" rx="12" fill="#161b22" stroke="#30363d"/><rect class="rail" x="195" y="44" width="2" height="240" fill="#30363d"/><g class="e" style="animation-delay:0.25s"><text x="24" y="48.5" class="w">Jul 2026 — now</text><circle cx="196" cy="44" r="6" fill="none" stroke="#ffa53a" stroke-width="2" class="ring"/><circle cx="196" cy="44" r="6" fill="#ffa53a"/><text x="222" y="49" class="r">Student Builder Campus Leader &amp; Group Leader</text><text x="222" y="70" class="o">Amazon Web Services</text><text x="222" y="94" class="p"><tspan class="b">▸ </tspan>Selected for AWS&#x27;s student technical leadership program; lead hands-on cloud and software</text><text x="236" y="114" class="p">build sessions.</text><text x="222" y="134" class="p"><tspan class="b">▸ </tspan>Run demos and peer-learning on AWS services, app development and troubleshooting.</text></g><g class="e" style="animation-delay:0.55s"><text x="24" y="178.5" class="w">Dec 2025 — Feb 2026</text><circle cx="196" cy="174" r="5.5" fill="#161b22" stroke="#8b949e" stroke-width="2"/><text x="222" y="179" class="r">Full-Stack Developer Intern</text><text x="222" y="200" class="o">Infosys</text><text x="222" y="224" class="p"><tspan class="b">▸ </tspan>Built features for an AI research-paper review and summarisation app (LitWise AI).</text><text x="222" y="244" class="p"><tspan class="b">▸ </tspan>Feature work, debugging, testing and code reviews in a Git-based team workflow.</text></g><g class="e" style="animation-delay:0.85s"><text x="24" y="288.5" class="w">Nov 2025</text><circle cx="196" cy="284" r="5.5" fill="#161b22" stroke="#8b949e" stroke-width="2"/><text x="222" y="289" class="r">Web Developer Intern</text><text x="222" y="310" class="o">InnoByte Services</text><text x="222" y="334" class="p"><tspan class="b">▸ </tspan>Shipped responsive web apps in HTML, CSS and JavaScript, from requirements to working UI.</text></g></svg>