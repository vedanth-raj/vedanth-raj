<svg xmlns="http://www.w3.org/2000/svg" width="860" height="212" viewBox="0 0 860 212" role="img" aria-label="GitHub stats"><title>GitHub stats</title><style>.n{font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}.k{font:12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e}.lg{font:12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}.pc{font:11.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.tile{animation:up .6s ease-out both}@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}.bar{transform-box:fill-box;transform-origin:left;animation:bar .9s cubic-bezier(.2,.8,.2,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="859" height="211" rx="12" fill="#161b22" stroke="#30363d"/><g class="tile" style="animation-delay:0.10s"><text x="24" y="58" class="n">281</text><text x="24" y="80" class="k">contributions · 1y</text></g><g class="tile" style="animation-delay:0.18s"><text x="186" y="58" class="n">2d</text><text x="186" y="80" class="k">current streak</text></g><line x1="172" y1="34" x2="172" y2="84" stroke="#21262d"/><g class="tile" style="animation-delay:0.26s"><text x="349" y="58" class="n">5d</text><text x="349" y="80" class="k">longest streak</text></g><line x1="335" y1="34" x2="335" y2="84" stroke="#21262d"/><g class="tile" style="animation-delay:0.34s"><text x="511" y="58" class="n">30</text><text x="511" y="80" class="k">best day</text></g><line x1="497" y1="34" x2="497" y2="84" stroke="#21262d"/><g class="tile" style="animation-delay:0.42s"><text x="674" y="58" class="n">22</text><text x="674" y="80" class="k">public repos</text></g><line x1="660" y1="34" x2="660" y2="84" stroke="#21262d"/><line x1="24" y1="1